# om-nlquery wren 服务 K8s 部署（密钥文件挂载版）
#
# 密钥管理：所有密钥统一放在一个 secrets.yml 文件里，挂载进容器
# 创建 Secret 示例：
#   kubectl create secret generic wren-secrets -n om-datacenter \
#     --from-file=secrets.yml=deploy/secrets/secrets.yml
#
# 更新密钥：
#   kubectl create secret generic wren-secrets -n om-datacenter \
#     --from-file=secrets.yml=deploy/secrets/secrets.yml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 镜像：SWR 构建后替换 <image>
# ─────────────────────────────────────────────────────────────
# Secret: 统一密钥文件
apiVersion: v1
kind: Secret
metadata:
  name: wren-secrets
  namespace: om-datacenter
type: Opaque
# ⚠️ 此处仅声明占位，实际值由上面 kubectl create secret 命令注入
stringData:
  secrets.yml: |
    database:
      datasource: postgres
      host: postgresql
      port: 5432
      database: onedata
      user: wren_ro
      password: CHANGE_ME
    glm:
      api_key: CHANGE_ME
    clone:
      token: ""
---
# PersistentVolumeClaim: LanceDB 向量数据库
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wren-state
  namespace: om-datacenter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: your-storage-class  # 按集群实际情况取消注释
---
# PersistentVolumeClaim: HuggingFace 模型缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wren-hf-cache
  namespace: om-datacenter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: your-storage-class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wren-nlquery
  namespace: om-datacenter
  labels:
    app: wren-nlquery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wren-nlquery
  template:
    metadata:
      labels:
        app: wren-nlquery
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: hf-model-init
          image: <image>
          command:
            - /bin/bash
            - -c
            - |
              set -e
              HF="/home/ccdev/.cache/huggingface"
              SENTINEL="$HF/hub/models--sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2"
              if [ -d "$SENTINEL" ]; then
                echo "[init] model cache present, skip download"
                exit 0
              fi
              echo "[init] downloading embedding model to $HF ..."
              python3 -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2'); print('done')"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: hf-cache
              mountPath: /home/ccdev/.cache/huggingface
      containers:
        - name: wren
          image: <image>   # 例 swr.cn-north-4.myhuaweicloud.com/opensourceway/om-nlquery-wren:v1
          ports:
            - containerPort: 8910
          env:
            # 非密钥类配置（密钥走 /wren-secrets/secrets.yml）
            - name: LLM_BASE_URL
              value: https://open.bigmodel.cn/api/coding/paas/v4
            - name: CHATBI_LLM_MODEL
              value: glm-5.3
            - name: HF_HOME
              value: /home/ccdev/.cache/huggingface
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }   # memory index 峰值 ~1.8G
          securityContext:
            runAsUser: 1000        # 容器内非 root（claude agent 必须）
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: wren-secrets
              mountPath: /wren-secrets
              readOnly: true
            - name: wren-state
              mountPath: /wren/.wren     # LanceDB 索引（持久化）
            - name: hf-cache
              mountPath: /home/ccdev/.cache/huggingface  # embedding 模型缓存（持久化）
          readinessProbe:
            httpGet: { path: /healthz, port: 8910 }
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: wren-secrets
          secret:
            secretName: wren-secrets
            defaultMode: 0400   # 只读
        - name: wren-state
          persistentVolumeClaim:
            claimName: wren-state
        - name: hf-cache
          persistentVolumeClaim:
            claimName: wren-hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: wren-nlquery
  namespace: om-datacenter
spec:
  selector:
    app: wren-nlquery
  ports:
    - name: http
      port: 8910
      targetPort: 8910
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wren-nlquery
  namespace: om-datacenter
spec:
  ingressClassName: nginx
  rules:
    - host: wren-nlquery.preview.test.osinfra.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wren-nlquery
                port:
                  number: 8910
